<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dharma Retreat House — a peaceful hotel where every stay supports the Tashol Tengyur School."
    />
    <title>Dharma Retreat House — Stay with purpose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved / system theme before first paint (keep the storage
      // key in sync with src/hooks/useTheme.ts), then preload only the hero
      // image that the homepage will actually show.
      (function () {
        var t;
        try {
          t = localStorage.getItem("dharma-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.style.colorScheme = t;

        var base = "%BASE_URL%";
        if (location.pathname === base || location.pathname + "/" === base) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = base + "dharmahouse-hero-" + t + ".jpg";
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        }
      })();
    </script>
    <style>
      /* Loading screen: shown until the app has rendered (src/main.tsx fades it out). */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff;
        transition: opacity 400ms ease;
      }
      [data-theme="dark"] #boot {
        background: #1a1f1b;
      }
      #boot img {
        width: min(340px, 70vw);
        height: auto;
        animation: boot-breathe 2.4s ease-in-out infinite;
      }
      #boot.boot--done {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.75;
          transform: scale(0.97);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: none;
        }
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Dharma Retreat House">
      <img id="boot-img" alt="" width="640" height="522" />
    </div>
    <script>
      // Pick the logo for the theme set above (only that one is downloaded).
      (function () {
        var dark =
          document.documentElement.getAttribute("data-theme") === "dark";
        document.getElementById("boot-img").src =
          "%BASE_URL%" +
          (dark ? "loading-screen-dark.webp" : "loading-screen.webp");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
